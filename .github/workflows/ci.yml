name: CI

# Quality gate for the "checks → merge → Vercel deploys" flow.
# Deployment itself is handled by Vercel's native Git integration
# (preview on PR, production on merge to main). This workflow only GATES.
on:
  push:
    branches: [main, develop]   # re-check main and develop after every merge
    # Saves minutes on develop. GitHub cannot scope paths-ignore to one
    # branch, so a docs-only push to main skips CI too; its pull request ran it.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:        # gate every PR before merge

# Elsewhere a newer push to the same ref cancels the older, in-flight run.
# On main nothing is ever cancelled and each run gets its own group: GitHub
# keeps only one pending run per group, so a shared group would still drop runs.
concurrency:
  group: ci-${{ github.ref }}${{ github.ref_name == 'main' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # pnpm BEFORE Node so the pnpm cache works.
      # No `version:` here on purpose — action-setup@v4 reads the pinned
      # `packageManager` (pnpm@8.15.7) from package.json, so CI, the lockfile
      # (lockfileVersion 6.0), and Vercel's build all use the SAME pnpm.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      # --frozen-lockfile = fail if pnpm-lock.yaml is out of date
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

      - name: Tool inventory drift
        run: pnpm run docs:check

      - name: Build
        run: pnpm run build

      - name: Verify standalone output
        run: test -f .next/standalone/server.js

      # A critical advisory blocks the merge.
      - name: Audit dependencies (critical)
        run: pnpm audit --audit-level=critical

      # Highs stay advisory until they are triaged.
      - name: Audit dependencies (high, advisory)
        run: pnpm audit --audit-level=high
        continue-on-error: true
